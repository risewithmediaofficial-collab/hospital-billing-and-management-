name: Hospital Management Platform CI/CD

on:
  push:
    branches:
      - main
      - test

  pull_request:
    branches:
      - main
      - test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build


  deploy-test:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Test Branch
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          timeout: 180s
          command_timeout: 20m

          script: |
            set -e
            if [ ! -d "/docker/hospital-billing-test/.git" ]; then
              echo "⚠️ Git repository missing in /docker/hospital-billing-test. Initializing fresh clone from test branch..."
              mkdir -p /docker
              rm -rf /docker/hospital-billing-test
              git clone -b test https://github.com/risewithmediaofficial-collab/hospital-billing-and-management-.git /docker/hospital-billing-test
            fi

            cd /docker/hospital-billing-test
            git fetch origin test
            git checkout test
            git reset --hard origin/test

            docker compose build --no-cache
            docker compose up -d --force-recreate

            echo "✅ Test deployment completed"


  deploy-production:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          timeout: 180s
          command_timeout: 20m

          script: |
            set -e
            if [ ! -d "/docker/hospital-billing/.git" ]; then
              echo "⚠️ Git repository missing in /docker/hospital-billing. Initializing fresh clone from main branch..."
              mkdir -p /docker
              rm -rf /docker/hospital-billing
              git clone -b main https://github.com/risewithmediaofficial-collab/hospital-billing-and-management-.git /docker/hospital-billing
            fi

            cd /docker/hospital-billing
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            docker compose build --no-cache
            docker compose up -d --force-recreate

            echo "✅ Production deployment completed"
