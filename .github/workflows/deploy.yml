name: Hospital Management Platform Deployment Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js with NPM Caching
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Fast Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy to VPS (Attempt 1)
        id: deploy1
        continue-on-error: true
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          timeout: 180s
          command_timeout: 20m
          script: |
            cd /docker/hospital-billing || cd /var/www/hospital-billing || cd ~/hospital-billing
            git pull origin main || git pull origin master
            docker compose up -d --build || docker-compose up -d --build

      - name: Deploy to VPS (Retry Attempt 2 if Attempt 1 timed out)
        if: steps.deploy1.outcome == 'failure' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          timeout: 180s
          command_timeout: 20m
          script: |
            cd /docker/hospital-billing || cd /var/www/hospital-billing || cd ~/hospital-billing
            git pull origin main || git pull origin master
            docker compose up -d --build || docker-compose up -d --build
