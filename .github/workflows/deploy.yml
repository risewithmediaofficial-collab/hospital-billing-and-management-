name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          timeout: 120s         # ← connection timeout
          command_timeout: 15m  # ← script execution timeout
          script: |
            mkdir -p /docker/hospital-billing
            cd /docker/hospital-billing
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/risewithmediaofficial-collab/hospital-billing-and-management-.git
              git fetch origin main
              git reset --hard origin/main
              git branch -M main
            else
              git pull origin main
            fi
            docker compose up -d --build
            docker compose exec -T backend npm run seed:superadmin
