name: Hospital Management Platform Deployment Workflow

on:
  push:
    branches: [ main, master, test ]
  pull_request:
    branches: [ main, master, test ]

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js with NPM Caching
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Fast Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  deploy-test:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Test Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          timeout: 180s
          command_timeout: 20m
          script: |
            DEPLOY_DIR="/docker/hospital-billing-test"
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              mkdir -p /docker
              rm -rf "$DEPLOY_DIR"
              git clone -b test https://github.com/risewithmediaofficial-collab/hospital-billing-and-management-.git "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"
            git fetch origin test
            git checkout test
            git reset --hard origin/test
            (docker compose up -d --build --force-recreate) || (docker-compose up -d --build --force-recreate)
            echo "✅ Test deployment completed successfully at $DEPLOY_DIR"

  deploy-production:
    needs: test-and-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          timeout: 180s
          command_timeout: 20m
          script: |
            DEPLOY_DIR="/docker/hospital-billing"
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              mkdir -p /docker
              rm -rf "$DEPLOY_DIR"
              git clone -b main https://github.com/risewithmediaofficial-collab/hospital-billing-and-management-.git "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"
            git fetch origin main || git fetch origin master || true
            git checkout main || git checkout master || true
            git reset --hard origin/main || git reset --hard origin/master || true
            (docker compose up -d --build --force-recreate) || (docker-compose up -d --build --force-recreate)
            echo "✅ Production deployment completed successfully at $DEPLOY_DIR"

