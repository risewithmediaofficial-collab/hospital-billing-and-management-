name: Hospital Management Platform Deployment Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js with NPM Caching
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Fast Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy to VPS (Attempt 1)
        id: deploy1
        continue-on-error: true
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          timeout: 180s
          command_timeout: 20m
          script: |
            DEPLOY_DIR=""
            for dir in \
              /docker/hospital-billing \
              /docker/hospital-billing-and-management- \
              /var/www/hospital-billing \
              /var/www/hospital-billing-and-management- \
              ~/hospital-billing \
              ~/hospital-billing-and-management- \
              /root/hospital-billing \
              /root/hospital-billing-and-management- \
              /home/*/hospital-billing \
              /home/*/hospital-billing-and-management-; do
              if [ -f "$dir/docker-compose.yml" ]; then
                DEPLOY_DIR="$dir"
                break
              fi
            done

            if [ -z "$DEPLOY_DIR" ]; then
              DEPLOY_DIR=$(find / -maxdepth 4 -name "docker-compose.yml" -not -path "*/proc/*" -not -path "*/sys/*" 2>/dev/null | head -n 1 | xargs dirname)
            fi

            if [ -n "$DEPLOY_DIR" ] && [ -d "$DEPLOY_DIR" ]; then
              echo "🚀 Found deployment workspace at: $DEPLOY_DIR"
              cd "$DEPLOY_DIR"
              git fetch origin main || git fetch origin master || true
              git reset --hard origin/main || git reset --hard origin/master || git pull origin main || true
              (docker compose up -d --build --force-recreate) || (docker-compose up -d --build --force-recreate)
              echo "✅ Docker deployment completed successfully at $DEPLOY_DIR"
            else
              echo "❌ Could not find hospital-billing deployment directory with docker-compose.yml"
              exit 1
            fi

      - name: Deploy to VPS (Retry Attempt 2 if Attempt 1 timed out)
        if: steps.deploy1.outcome == 'failure' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          timeout: 180s
          command_timeout: 20m
          script: |
            DEPLOY_DIR=""
            for dir in \
              /docker/hospital-billing \
              /docker/hospital-billing-and-management- \
              /var/www/hospital-billing \
              /var/www/hospital-billing-and-management- \
              ~/hospital-billing \
              ~/hospital-billing-and-management- \
              /root/hospital-billing \
              /root/hospital-billing-and-management- \
              /home/*/hospital-billing \
              /home/*/hospital-billing-and-management-; do
              if [ -f "$dir/docker-compose.yml" ]; then
                DEPLOY_DIR="$dir"
                break
              fi
            done

            if [ -z "$DEPLOY_DIR" ]; then
              DEPLOY_DIR=$(find / -maxdepth 4 -name "docker-compose.yml" -not -path "*/proc/*" -not -path "*/sys/*" 2>/dev/null | head -n 1 | xargs dirname)
            fi

            if [ -n "$DEPLOY_DIR" ] && [ -d "$DEPLOY_DIR" ]; then
              echo "🚀 Found deployment workspace at: $DEPLOY_DIR"
              cd "$DEPLOY_DIR"
              git fetch origin main || git fetch origin master || true
              git reset --hard origin/main || git reset --hard origin/master || git pull origin main || true
              (docker compose up -d --build --force-recreate) || (docker-compose up -d --build --force-recreate)
              echo "✅ Docker deployment completed successfully at $DEPLOY_DIR"
            else
              echo "❌ Could not find hospital-billing deployment directory with docker-compose.yml"
              exit 1
            fi
