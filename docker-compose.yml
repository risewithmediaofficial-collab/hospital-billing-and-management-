services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-hpmbs}_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-86}:80"
    depends_on:
      - backend
    networks:
      - hpmbs_net

  mongo:
    image: mongo:7.0
    container_name: ${COMPOSE_PROJECT_NAME:-hpmbs}_mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-hpmbs_db}
    volumes:
      - mongo_data:/data/db
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - hpmbs_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-hpmbs}_backend
    restart: always
    env_file:
      - .env
    environment:
      PORT: 5000
    expose:
      - "5000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - hpmbs_net

networks:
  hpmbs_net:
    driver: bridge

volumes:
  mongo_data:
