services:
  # Keep the user-facing service first for Docker managers that select the
  # first declared Compose service when opening a project.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hpmbs_frontend
    restart: always
    ports:
      - "86:80"
    depends_on:
      - backend

  mongo:
    image: mongo:7.0
    container_name: hpmbs_mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: hpmbs_db
    volumes:
      - mongo_data:/data/db
    ports:
      - "27021:27017"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hpmbs_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/hpmbs_db
      JWT_SECRET: ${JWT_SECRET:-hpmbs_super_secure_jwt_secret_key_2026_x89}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-hpmbs_super_secure_refresh_secret_key_2026_x89}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-30d}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-aHBtYnNfYWVzMjU2X2VuY3J5cHRpb25fa2V5XzMyYiE=}
      SEARCH_HASH_KEY: ${SEARCH_HASH_KEY:-hpmbs_search_hash_secret_key_2026_production_safe_key_32b}
      CORS_ORIGIN: "*"
    ports:
      - "5003:5000"
    depends_on:
      - mongo

volumes:
  mongo_data:
